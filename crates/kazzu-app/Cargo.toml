[package]
name = "kazzu-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kazzu: interface desktop (Slint) do player de música"
build = "build.rs"

[[bin]]
name = "kazzu"
path = "src/main.rs"

[lib]
name = "kazzu_app"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["demo"]
# Gera uma biblioteca de demonstração (WAV/FLAC fictícios com tags e capa) para `--demo-library`.
demo = ["dep:hound", "dep:flacenc", "dep:lofty"]
# Renderer Skia (opt-in; baixa binários do Skia no build). Útil para iOS/Android no futuro.
skia = ["slint/renderer-skia"]
# libopus estática (CI desktop Windows, sem libopus do sistema).
opus-bundled = ["kazzu-audio/opus-bundled"]

[dependencies]
kazzu-core = { path = "../kazzu-core" }
kazzu-audio = { path = "../kazzu-audio" }
kazzu-library = { path = "../kazzu-library" }
kazzu-ytm = { path = "../kazzu-ytm" }

crossbeam-channel = "0.5"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thiserror = "2"
# Capas de provedores remotos (mesma pilha TLS do kazzu-audio/kazzu-ytm: rustls, sem OpenSSL).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sys-locale = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

hound = { version = "3.5", optional = true }
flacenc = { version = "0.5", optional = true }
lofty = { version = "0.25", optional = true }

[build-dependencies]
slint-build = "1.19"

# --- Desktop (Linux/Windows/macOS) ---
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
pollster = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# --- Android (ver docs/ANDROID.md) ---
# Backend `android-activity` do Slint (NativeActivity, sem Java/Gradle próprio). Sem `backend-default`: o winit não é usado.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-android-activity-06",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
] }
# libopus compilada junto (cmake do SDK): no Android não há libopus do sistema.
symphonia-adapter-libopus = { version = "0.3", default-features = false, features = ["bundled"] }
# Logs no logcat (nada sai do aparelho).
android_logger = "0.15"
# Pedido de permissão em tempo de execução (checkSelfPermission/requestPermissions).
jni = "0.21"

[dev-dependencies]
hound = "3.5"
lofty = "0.25"
tempfile = "3"
