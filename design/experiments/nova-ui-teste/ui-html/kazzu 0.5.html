/* =====================================================================
   10b. LETRA IMERSIVA: linha ativa centralizada, linhas distantes desfocadas, sem rolagem.
   Sincronia: se a faixa tiver `times` (segundos, uma por linha) usa os tempos;
   senão distribui as linhas pela duração (aproximação até haver letras com tempo).
   ===================================================================== */
const LY = { id: null, idx: -2 };
function renderLyrics() {
  const t = current(), box = $('lyrics');
  if (!t.lyrics.length) {
    box.innerHTML = '<div class="ly-empty-wrap"><div class="ly empty">Letra não cadastrada para esta música</div></div>';
    LY.id = null; return;
  }
  if (LY.id !== t.id) {
    LY.id = t.id; LY.idx = -2;
    box.innerHTML = '<div class="ly-track" id="ly-track">' +
      t.lyrics.map((l, i) => `<div class="ly" data-i="${i}">${l}</div>`).join('') + '</div>';
    $('ly-track').addEventListener('click', e => {
      const el = e.target.closest('.ly');
      if (!el || !t.times) return;           // só pula para a linha se houver tempos
      STATE.player.pos = t.times[+el.dataset.i]; updateProgress();
    });
  }
  updateLyrics(true);
}
function updateLyrics(force) {
  const t = current(), tr = $('ly-track');
  if (!tr || !t.lyrics.length) return;
  const n = t.lyrics.length, pos = STATE.player.pos;
  let idx = 0;
  if (t.times && t.times.length === n) { for (let i = 0; i < n; i++) if (pos >= t.times[i]) idx = i; }
  else idx = Math.min(n - 1, Math.floor((pos / t.duration) * n));
  if (!force && idx === LY.idx) return;
  LY.idx = idx;
  [...tr.children].forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.classList.toggle('on', i === idx);
    el.style.setProperty('--b', d > 1 ? Math.min(d * 0.8, 3).toFixed(1) + 'px' : '0px');
  });
  const box = $('lyrics'), el = tr.children[idx];
  if (el) tr.style.transform = `translateY(${(box.clientHeight / 2 - (el.offsetTop + el.offsetHeight / 2)).toFixed(1)}px)`;
}

/* =====================================================================
   11. INICIALIZAÇÃO
   ===================================================================== */
function init() {
  // ícones fixos do dock e da bolha
  $('search-bubble').innerHTML = icon('search');
  // ícones fixos da ilha/player já são pintados pelas funções acima
  if (isLowEnd()) STATE.radio.perf = 0;   // aparelho modesto começa em Economia de bateria
  syncVisualToggles();
  renderPlayerUI();
  navigate('home', { push: false });
}
init();

/* =====================================================================
   FX. Camada visual (mesh, blur progressivo, Cover Flow, waveform, morph).
   Envolve funções existentes sem alterar a lógica. Cada bloco é independente.
   ===================================================================== */
(function () {
  const app = $('app'), root = document.documentElement;
  const GLASS = '.mini,.dock,.search-bubble,.p-island,.pill-actions,.p-seg';
  const MAG = '.p-play,.p-nav,.search-bubble';   /* magnetismo só onde ajuda o toque */
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduce = () => !STATE.toggles.animations || STATE.radio.perf === 0 || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isColor = s => typeof s === 'string' && /^(#|rgb|hsl)/i.test(s);
  let cols = null;

  /* Mesh ambiente + blur progressivo + brilho do player */
  const mesh = document.createElement('div'); mesh.id = 'mesh'; mesh.setAttribute('aria-hidden', 'true'); app.prepend(mesh);
  ['top', 'bottom'].forEach(k => { const d = document.createElement('div'); d.className = 'pb pb-' + k; d.setAttribute('aria-hidden', 'true'); app.appendChild(d); });
  const glow = document.createElement('div'); glow.className = 'p-glow'; glow.id = 'p-glow'; $('p-cover').before(glow);

  const _as = applyScheme;
  applyScheme = function (seed) {
    _as(seed); cols = null;
    const cs = getComputedStyle(root), g = n => cs.getPropertyValue(n).trim();
    root.style.setProperty('--m1', isColor(seed) && STATE.toggles.dynamicColor ? seed : g('--accent'));
    root.style.setProperty('--m2', g('--accent-2'));
    root.style.setProperty('--m3', g('--accent-container'));
  };

  /* Pílula do dock que desliza (morph) entre itens */
  const pill = document.createElement('i'); pill.id = 'dock-pill';
  const DOCK = [['home', 'Início', 'home'], ['explore', 'Explorar', 'compass'], ['library', 'Biblioteca', 'library']];
  function movePill() {
    const dock = $('dock'), a = dock.querySelector('button.active');
    if (!a) { pill.style.opacity = 0; return; }
    const first = !pill._i;
    if (first) pill.style.transition = 'none';
    pill.style.width = a.offsetWidth + 'px'; pill.style.transform = `translateX(${a.offsetLeft}px)`; pill.style.opacity = 1;
    if (first) { pill.offsetWidth; pill.style.transition = ''; pill._i = 1; }
  }
  renderDock = function () {
    const dock = $('dock');
    if (!dock.querySelector('button')) {
      dock.innerHTML = DOCK.map(([s, l, ic]) => `<button onclick="navigate('${s}')">${icon(ic)}<span>${l}</span></button>`).join('');
    }
    if (!pill.isConnected) dock.appendChild(pill);
    dock.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', STATE.screen === DOCK[i][0]));
    movePill();
  };

  /* Navegação: título editorial animado + estado de scroll */
  function splitHero(el) {
    if (el.dataset.sp || reduce()) return; el.dataset.sp = 1;
    const txt = el.textContent; el.setAttribute('aria-label', txt);
    el.innerHTML = txt.split(' ').map((w, i) => `<span class="w" aria-hidden="true"><span style="--i:${i}">${w}</span></span>`).join(' ');
  }
  const _nav = navigate;
  navigate = function (...a) {
    _nav(...a);
    requestAnimationFrame(() => {
      const sc = document.querySelector('.screen.active'); if (!sc) return;
      app.classList.toggle('scrolled', sc.scrollTop > 6);
      sc.querySelectorAll('.h-hero').forEach(splitHero); movePill();
      const cf = sc.querySelector('.cf'); if (cf) cfUpdate(cf);
    });
  };
  app.addEventListener('scroll', e => {
    const s = e.target; if (!s.classList || !s.classList.contains('screen')) return;
    app.classList.toggle('scrolled', s.scrollTop > 6);
    mesh.style.translate = `0 ${-Math.min(s.scrollTop, 600) * 0.08}px`;
  }, true);

  /* Capas com vinil em Explorar */
  function cfUpdate(cf) {
    const mid = cf.scrollLeft + cf.clientWidth / 2; let best = null, bd = 1e9;
    cf.querySelectorAll('.cf-item').forEach(it => {
      const d = (it.offsetLeft + it.offsetWidth / 2 - mid) / 156, ad = Math.abs(d);
      it.style.transform = `scale(${(1 - Math.min(ad, 1) * 0.18).toFixed(3)})`; it.style.opacity = (1 - Math.min(ad, 1) * 0.5).toFixed(2);
      if (ad < bd) { bd = ad; best = it; }
    });
    if (best && cf._c !== best) { cf._c = best; const t = trackById(best.dataset.id); $('cf-t').textContent = t.title; $('cf-a').textContent = t.artist; }
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let ttPlaced = null, ttBusy = false;
  function ttSync() {
    const tt = $('tt'); if (!tt) return;
    const on = !!ttPlaced && !!STATE.player.playing && current().id === ttPlaced;
    tt.classList.toggle('playing', on); tt.classList.toggle('armed', on);
  }
  function setRec(t) { const rec = $('tt-rec'); rec.firstElementChild.style.backgroundImage = trackCover(t); rec.classList.add('on'); }
  /* O disco voa de um elemento a outro (cópia animada) */
  function ttFly(vs, from, to, dur) {
    const v = vs.getBoundingClientRect(), a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const g = from.cloneNode(true); g.className = 'vinyl vs-fly'; g.removeAttribute('id');
    g.style.cssText = `left:${a.left - v.left}px;top:${a.top - v.top}px;width:${a.width}px;height:${a.height}px;transition:none;opacity:1`;
    vs.appendChild(g);
    const dx = b.left - a.left, dy = b.top - a.top, k = b.width / a.width;
    return g.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(1)' },
      { transform: `translate(${dx / 2}px,${dy / 2 - 26}px) rotate(180deg) scale(${((1 + k) / 2 + .04).toFixed(3)})`, offset: .5 },
      { transform: `translate(${dx}px,${dy}px) rotate(360deg) scale(${k})` }
    ], { duration: dur, easing: 'cubic-bezier(.45,.05,.2,1)', fill: 'forwards' }).finished.then(() => g.remove());
  }
  async function ttPlace(vs, it) {
    ttBusy = true;
    const id = it.dataset.id, t = trackById(id), vin = it.querySelector('.vinyl'), rec = $('tt-rec');
    const start = () => { ttPlaced = id; if (current().id === id) { if (!STATE.player.playing) togglePlay(); } else playTrack(id); ttSync(); };
    if (reduce()) { it.classList.add('gone'); setRec(t); start(); ttBusy = false; return; }
    it.classList.add('out'); await wait(460);            /* a capa abre: o disco sai */
    const fl = ttFly(vs, vin, rec, 720); it.classList.add('gone');
    await fl; setRec(t); start(); ttBusy = false;        /* pousa no prato; o braço desce */
  }
  async function ttReturn(vs) {
    ttBusy = true;
    const id = ttPlaced, it = vs.querySelector(`.cf-item[data-id="${id}"]`), rec = $('tt-rec');
    if (STATE.player.playing && current().id === id) togglePlay();
    ttPlaced = null; ttSync();
    if (!it || reduce()) { rec.classList.remove('on'); if (it) it.classList.remove('gone', 'out'); ttBusy = false; return; }
    const vin = it.querySelector('.vinyl'); await wait(450);   /* o braço sobe */
    vin.style.transition = 'none'; vin.style.opacity = '0'; it.classList.remove('gone');
    const fl = ttFly(vs, rec, vin, 640); rec.classList.remove('on');
    await fl; vin.style.opacity = '1'; vin.offsetWidth; vin.style.transition = ''; vin.style.opacity = ''; it.classList.remove('out');
    ttBusy = false;
  }
  const _re = renderExplore;
  renderExplore = function () {
    _re(); ttBusy = false;
    const sc = $('screen-explore'), slot = sc.querySelector('#cf-slot'); if (!slot) return;
    const el = document.createElement('div'); el.className = 'vs';
    el.innerHTML = `<div class="cf-wrap"><div class="cf hide-scroll" aria-label="Discos em destaque">${TRACKS.slice(0, 10).map(t =>
      `<div class="cf-item" data-id="${t.id}" role="button" aria-label="${t.title}, ${t.artist}"><div class="vinyl"><i class="vl" style="background-image:${trackCover(t)}"></i></div><div class="cf-sleeve" style="background-image:${trackCover(t)}"></div></div>`).join('')}</div></div>
      <div class="cf-cap"><b id="cf-t"></b><span id="cf-a"></span></div>
      <div class="tt" id="tt"><div class="tt-platter" id="tt-platter" role="button" aria-label="Tocar ou pausar o disco"><div class="vinyl tt-rec" id="tt-rec"><i class="vl"></i></div><i class="tt-glare"></i></div><i class="tt-rest"></i><i class="tt-arm"></i><i class="tt-pivot"></i><i class="tt-led"></i><button class="tt-knob" id="tt-knob" aria-label="Iniciar ou parar"></button><i class="tt-pitch"><b></b></i><span class="tt-rpm">33⅓</span></div>`;
    slot.replaceWith(el);
    if (ttPlaced) {
      const it = el.querySelector(`.cf-item[data-id="${ttPlaced}"]`);
      if (it) { it.classList.add('gone', 'out'); setRec(trackById(ttPlaced)); } else ttPlaced = null;
    }
    ttSync();
    const cf = el.querySelector('.cf'); let r = 0;
    cf.addEventListener('scroll', () => { if (!r) r = requestAnimationFrame(() => { r = 0; cfUpdate(cf); }); }, { passive: true });
    cf.addEventListener('click', async e => {
      const it = e.target.closest('.cf-item'); if (!it || ttBusy) return;
      if (it !== cf._c) { cf.scrollTo({ left: it.offsetLeft + it.offsetWidth / 2 - cf.clientWidth / 2, behavior: 'smooth' }); return; }
      if (ttPlaced === it.dataset.id) { await ttReturn(el); return; }
      if (ttPlaced) await ttReturn(el);
      await ttPlace(el, it);
    });
    $('tt-knob').addEventListener('click', () => $('tt-platter').click());
    $('tt-platter').addEventListener('click', () => {
      if (!ttPlaced || ttBusy) return;
      if (current().id !== ttPlaced) playTrack(ttPlaced); else togglePlay();
    });
    requestAnimationFrame(() => cfUpdate(cf));
  };

  /* Waveform na barra de progresso do player */
  const cv = document.createElement('canvas'); cv.className = 'wave'; cv.setAttribute('aria-hidden', 'true'); $('p-seek-wrap').prepend(cv);
  let wave = [], waveId = null;
  function seedWave(id) {
    let h = 2166136261; for (const c of id) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    const n = 72, a = []; let v = .5;
    for (let i = 0; i < n; i++) { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; v = v * .55 + (((h >>> 0) % 1000) / 1000) * .45 + (i % 9 === 0 ? .15 : 0); a.push(.16 + Math.min(1, v) * .84 * (.75 + .25 * Math.sin(i / n * Math.PI * 3 + id.length))); }
    return a;
  }
  function drawWave() {
    const t = current(), w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    if (waveId !== t.id) { wave = seedWave(String(t.id)); waveId = t.id; }
    const d = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    if (!cols) { const cs = getComputedStyle(root); cols = [cs.getPropertyValue('--accent').trim() || '#fff', cs.getPropertyValue('--text').trim() || '#fff']; }
    const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
    const n = wave.length, gap = 3, bw = (w - gap * (n - 1)) / n, pct = STATE.player.pos / t.duration;
    for (let i = 0; i < n; i++) {
      const bh = Math.max(4, wave[i] * h), played = (i + .5) / n <= pct, bx = i * (bw + gap);
      x.globalAlpha = played ? 1 : .28; x.fillStyle = cols[played ? 0 : 1]; x.beginPath();
      if (x.roundRect) x.roundRect(bx, (h - bh) / 2, bw, bh, bw / 2); else x.rect(bx, (h - bh) / 2, bw, bh);
      x.fill();
    }
  }
  const _up = updateProgress; updateProgress = function () { _up(); drawWave(); };
  const _rp = renderPlayerUI;
  renderPlayerUI = function () {
    _rp(); const t = current(), p = STATE.player;
    glow.style.backgroundImage = trackCover(t);
    $('player').classList.toggle('is-playing', !!p.playing); ttSync();
    $('mini-art').style.boxShadow = isColor(t.art) ? `0 6px 18px color-mix(in srgb, ${t.art} 55%, transparent)` : '';
    drawWave();
  };
  const _tp = togglePlay; togglePlay = function () { _tp(); $('player').classList.toggle('is-playing', !!STATE.player.playing); };
  addEventListener('resize', () => { drawWave(); const cf = document.querySelector('.cf'); if (cf) cfUpdate(cf); });

  /* Morph mini capa ↔ capa do player (View Transitions, com fallback) */
  const _op = openPlayer, _cl = closePlayer;
  function morph(fn, toPlayer) {
    const pl = $('player'), isOpen = pl.classList.contains('open');
    if (!document.startViewTransition || reduce() || toPlayer === isOpen) { fn(); return; }
    const ma = $('mini-art'), pc = $('p-cover'), from = toPlayer ? ma : pc, to = toPlayer ? pc : ma;
    pl.classList.add('vt'); from.style.viewTransitionName = 'kz-cover';
    const t = document.startViewTransition(() => { from.style.viewTransitionName = ''; to.style.viewTransitionName = 'kz-cover'; fn(); });
    t.finished.finally(() => { ma.style.viewTransitionName = ''; pc.style.viewTransitionName = ''; pl.classList.remove('vt'); });
  }
  openPlayer = function () { morph(_op, true); };
  closePlayer = function () { morph(_cl, false); };

  /* Especular do vidro, botões magnéticos, tilt da capa, sliders elásticos */
  let raf = 0, last = null, mg = null;
  function spec(e) {
    const g = e.target.closest && e.target.closest(GLASS); if (!g) return;
    const r = g.getBoundingClientRect(), px = (e.clientX - r.left) / r.width;
    g.style.setProperty('--mx', (px * 100).toFixed(1) + '%'); g.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    g.style.setProperty('--ang', Math.round(px * 360) + 'deg');
  }
  document.addEventListener('pointermove', e => {
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const ev = last; spec(ev);
      if (!fine || reduce()) return;
      const m = ev.target.closest && ev.target.closest(MAG);
      if (mg && mg !== m) { mg.style.translate = ''; mg = null; }
      if (m) { mg = m; const r = m.getBoundingClientRect(); m.style.translate = `${((ev.clientX - r.left - r.width / 2) * .22).toFixed(1)}px ${((ev.clientY - r.top - r.height / 2) * .22).toFixed(1)}px`; }
      if ($('player').classList.contains('open')) {
        const s = document.querySelector('.p-stage').getBoundingClientRect(), dx = (ev.clientX - s.left - s.width / 2) / s.width, dy = (ev.clientY - s.top - s.height / 2) / s.height, st = document.querySelector('.p-stage').style;
        st.setProperty('--ry', (Math.max(-1, Math.min(1, dx)) * 9).toFixed(1) + 'deg'); st.setProperty('--rx', (-Math.max(-1, Math.min(1, dy)) * 9).toFixed(1) + 'deg'); st.setProperty('--sx', (50 + dx * 60).toFixed(0) + '%');
      }
    });
  }, { passive: true });
  document.addEventListener('pointerdown', e => {
    spec(e);
    const s = e.target.closest && e.target.closest('.p-slider'); if (!s) return;
    s.classList.add('drag');
    const up = () => { s.classList.remove('drag'); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }, { passive: true });

  /* Aplica tudo no estado atual */
  applyScheme(STATE.schemeSeed || current().art);
  renderPlayerUI();
  navigate(STATE.screen || 'home', { push: false });
})();
</script>
