<body>
<div id="app">
  <nav class="desktop-rail" aria-label="Navegação principal">
    <div class="desktop-rail-head">
      <div class="desktop-brand" role="img" aria-label="Kazzu"><span class="brand-mark"></span><span class="brand-word"></span></div>
      <button class="rail-toggle" id="rail-toggle" type="button" aria-label="Recolher menu" aria-expanded="true" title="Recolher menu" onclick="toggleDesktopRail()"><i data-icon="back"></i></button>
    </div>
    <div class="rail-label">MENU</div>
    <button class="rail-link" type="button" data-screen="home" aria-label="Início" title="Início" onclick="navigate('home')"><i data-icon="home"></i><span>Início</span><i class="rail-chev" data-icon="chev"></i></button>
    <button class="rail-link" type="button" data-screen="explore" aria-label="Explorar" title="Explorar" onclick="navigate('explore')"><i data-icon="compass"></i><span>Explorar</span><i class="rail-chev" data-icon="chev"></i></button>
    <button class="rail-link" type="button" data-screen="library" aria-label="Biblioteca" title="Biblioteca" onclick="navigate('library')"><i data-icon="library"></i><span>Biblioteca</span><i class="rail-chev" data-icon="chev"></i></button>
    <div class="rail-divider"></div>
    <button class="rail-link" type="button" data-screen="settings" aria-label="Configurações" title="Configurações" onclick="navigate('settings')"><i data-icon="gauge"></i><span>Configurações</span><i class="rail-chev" data-icon="chev"></i></button>
    <div class="rail-bottom">
      <div class="rail-divider"></div>
      <div class="rail-player">
        <button class="rail-now" id="rail-open" type="button" aria-label="Abrir player" onclick="openPlayer()"><span class="art" id="rail-art"></span><span class="meta"><span class="t" id="rail-title"></span><span class="a" id="rail-artist"></span></span></button>
        <input class="rail-progress" id="rail-progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Progresso da música" oninput="seek(this.value)">
        <div class="rail-controls">
          <button id="rail-prev" type="button" aria-label="Anterior" title="Anterior" onclick="prev()"></button>
          <button id="rail-play" type="button" aria-label="Reproduzir ou pausar" title="Reproduzir ou pausar" onclick="togglePlay()"></button>
          <button id="rail-next" type="button" aria-label="Próxima" title="Próxima" onclick="next()"></button>
        </div>
      </div>
    </div>
  </nav>
  <header class="app-toolbar" id="app-toolbar">
    <form class="app-search" role="search" id="catalog-search-form">
      <i data-icon="search"></i>
      <input id="catalog-search" type="search" aria-label="Buscar no catálogo" aria-keyshortcuts="Control+K Meta+K" placeholder="Buscar músicas, artistas ou álbuns" autocomplete="off">
      <kbd aria-hidden="true">Ctrl + K</kbd>
    </form>
    <button type="button" class="toolbar-replay" id="toolbar-replay" aria-label="Replay" title="Replay" onclick="navigateFromToolbar('replay')"><i data-icon="chart"></i><span>Replay</span></button>
    <div class="profile-control" id="profile-control">
      <button class="avatar" type="button" id="profile-toggle" aria-label="Menu da conta" aria-expanded="false" aria-controls="profile-menu" title="Menu da conta" onclick="toggleProfileMenu()">C</button>
      <div class="profile-menu" id="profile-menu" hidden>
        <button type="button" onclick="navigateFromToolbar('settings-page', 'conta')"><i data-icon="user"></i>Perfil e conta</button>
        <button type="button" onclick="navigateFromToolbar('settings')"><i data-icon="gauge"></i>Configurações do app</button>
      </div>
    </div>
  </header>

  <!-- Telas (conteúdo gerado a partir de DATA pelas funções render*) -->
  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-explore"></section>
  <section class="screen" id="screen-library"></section>
  <section class="screen" id="screen-replay"></section>
  <section class="screen" id="screen-search"></section>
  <section class="screen screen-sub" id="screen-settings"></section>
  <section class="screen screen-sub" id="screen-settings-page"></section>
  <section class="screen screen-sub" id="screen-appearance"></section>

  <!-- Controles de reprodução e navegação para janelas estreitas -->
  <div id="island">
    <div class="mini" id="mini" onclick="openPlayer()">
      <button class="info" id="mini-open" type="button" aria-label="Abrir player" onclick="event.stopPropagation(); openPlayer()"><span class="art" id="mini-art"></span>
        <span style="min-width:0">
          <span class="t" id="mini-title" style="display:block"></span>
          <span class="a" id="mini-artist" style="display:block"></span>
        </span>
      </button>
      <div style="display:flex; align-items:center; gap:4px;" onclick="event.stopPropagation()">
        <button class="icon-ghost" id="mini-like" aria-label="Curtir" onclick="toggleLike()"></button>
        <button class="icon-ghost" id="mini-prev" aria-label="Anterior" onclick="prev()"></button>
        <button class="icon-ghost" id="mini-play" aria-label="Reproduzir ou pausar" onclick="togglePlay()"></button>
        <button class="icon-ghost" id="mini-next" aria-label="Próxima" onclick="next()"></button>
      </div>
      <div class="bar" id="mini-bar"></div>
    </div>
    <div class="dock-row">
      <nav class="dock" id="dock"></nav>
    </div>
  </div>

  <!-- Player expandido -->
  <div id="player" class="hide-scroll" role="dialog" aria-label="Player expandido" inert>
    <div class="p-top">
      <button class="icon-btn" aria-label="Recolher" onclick="closePlayer()"></button>
      <div class="p-seg" role="tablist">
        <button class="active" id="p-tab-audio" role="tab" aria-label="Áudio"></button>
        <button id="p-tab-video" role="tab" aria-label="Vídeo" onclick="showToast('Reprodução em vídeo indisponível nesta versão')"></button>
      </div>
      <div class="p-top-spacer"></div>
    </div>
    <div class="p-stage">
      <div class="p-disc" id="p-disc" onclick="toggleLyrics()"><div class="p-disc-rec"><i class="vl" id="p-disc-label"></i></div></div>
      <i class="p-pivot" id="p-pivot"></i><div class="p-arm" id="p-arm"><div class="pa-sweep"><i class="pa-counter"></i><i class="pa-tube"></i><i class="pa-head"></i></div></div>
      <div class="p-cover" id="p-cover" onclick="toggleLyrics()"><div class="album" id="p-album"></div></div>
      <div class="p-lyrics" id="p-lyrics">
        <div class="p-lyrics-head"><span>LETRA</span><button class="p-lyrics-close" onclick="toggleLyrics()">Voltar à capa ✕</button></div>
        <div class="p-lyrics-body hide-scroll" id="lyrics"></div>
      </div>
    </div>
    <div class="p-console">
      <div class="p-meta">
        <div class="info">
          <div class="title" id="p-title"></div>
          <div class="artist" id="p-artist"></div>
        </div>
        <div class="actions">
          <button class="p-round" id="p-share" aria-label="Compartilhar" onclick="share()"></button>
          <button class="p-heart" id="p-heart" aria-label="Curtir" onclick="toggleLike()"></button>
        </div>
      </div>
      <section class="p-island" aria-label="Controles de reprodução">
        <div>
          <div class="p-slider" id="p-seek-wrap"><div class="fill"></div>
            <input id="p-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Progresso" oninput="seek(this.value)"/></div>
          <div class="p-times"><span id="p-cur">0:00</span><span id="p-rem">-0:00</span></div>
        </div>
        <div class="p-row">
          <button class="p-mode" id="p-shuffle" aria-label="Aleatório" onclick="toggleMode('shuffle')"></button>
          <button class="p-nav" id="p-prev" aria-label="Anterior" onclick="prev()"></button>
          <button class="p-play" id="p-play" aria-label="Reproduzir ou pausar" onclick="togglePlay()"></button>
          <button class="p-nav" id="p-next" aria-label="Próxima" onclick="next()"></button>
          <button class="p-mode" id="p-repeat" aria-label="Repetir" onclick="toggleMode('repeat')"></button>
        </div>
        <div class="p-vol">
          <span id="v-low"></span>
          <div class="p-slider vol" id="p-vol-wrap"><div class="fill"></div>
            <input id="p-vol" type="range" min="0" max="100" value="70" aria-label="Volume" oninput="setVolume(this.value)"/></div>
          <span id="v-high"></span>
        </div>
        <div class="p-tools">
          <button class="p-tool" id="p-tool-queue" aria-label="Fila" onclick="openQueue()"></button>
          <button class="p-tool" id="p-tool-lyrics" aria-label="Letra" onclick="toggleLyrics()"></button>
          <button class="p-tool" id="p-tool-timer" aria-label="Temporizador" onclick="showToast('Temporizador: desligar em 30 minutos')"></button>
          <button class="p-tool" id="p-tool-more" aria-label="Mais" onclick="openMore()"></button>
          <button class="p-tool p-device" id="p-device" aria-label="Saída: Este aparelho" onclick="showToast('Saída: alto-falantes do aparelho')"></button>
        </div>
      </section>
    </div>
  </div>

  <!-- Fila -->
  <div id="queue" role="dialog" aria-label="Fila de reprodução" inert>
    <div class="q-head">
      <div style="font-size:18px; font-weight:800;">Fila de reprodução</div>
      <button class="icon-btn" id="q-close" aria-label="Fechar fila" onclick="closeQueue()"></button>
    </div>
    <div class="q-list hide-scroll" id="queue-list"></div>
  </div>

  <!-- Menu "..." do player -->
  <div id="more-scrim" onclick="closeMore()"></div>
  <div id="more" role="dialog" aria-modal="true" aria-label="Mais opções" inert></div>

  <div class="toast" id="toast" role="status"></div>
</div>

/* Capa gerada (SVG embutido): fundo sólido + motivo geométrico. Sem gradientes. */
function coverUrl(art, motif) {
  const fg = '#ffffff';
  let body = '';
  if (motif === 0) body = [110, 70, 35].map(r => `<circle cx="150" cy="150" r="${r}" fill="none" stroke="${fg}" stroke-width="10" opacity=".85"/>`).join('');
  else if (motif === 1) body = [30, 80, 130, 180, 230].map((y, i) => `<rect x="0" y="${y}" width="300" height="18" fill="${fg}" opacity="${i % 2 ? 0.35 : 0.7}"/>`).join('');
  else if (motif === 2) body = `<polygon points="150,50 260,240 40,240" fill="none" stroke="${fg}" stroke-width="12"/><circle cx="150" cy="170" r="34" fill="${fg}"/>`;
  else if (motif === 3) body = [0, 1, 2, 3].flatMap(r => [0, 1, 2, 3].map(c => `<rect x="${30 + c * 70}" y="${30 + r * 70}" width="50" height="50" rx="10" fill="${fg}" opacity="${0.25 + ((r + c) % 3) * 0.25}"/>`)).join('');
  else body = `<circle cx="120" cy="200" r="45" fill="${fg}"/><rect x="152" y="60" width="18" height="150" fill="${fg}"/><path d="M170 60 Q230 90 220 150 Q205 120 170 118 Z" fill="${fg}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${art}"/>${body}</svg>`;
  // URL sem aspas, com parênteses e aspas simples codificados: seguro dentro de atributo style="..."
  const enc = encodeURIComponent(svg).replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29');
  return `url(data:image/svg+xml;charset=utf-8,${enc})`;
}
/* Capa real (t.image = caminho da imagem licenciada) tem prioridade sobre a capa gerada */
const trackCover = t => t.image ? `url(${t.image})` : coverUrl(t.art, t.motif);


/* =====================================================================
   6b. MATERIAL 3 (You): esquema de cores a partir de uma semente
   Aproximação em HSL dos tons do HCT do Material 3 (tons 6–98 para superfícies,
   20–90 para cores de destaque). Para fidelidade total use material-color-utilities.
   ===================================================================== */
function hexToRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
}
function hexToHsl(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
}

/* Contraste WCAG: o HSL não é perceptual (o amarelo fica claro demais com L=40%).
   No tema claro, o acento é o tom mais claro que ainda chega a 4,8:1 sobre branco
   (cobre texto normal sobre a superfície, que é um pouco mais escura). */
function relLum(hex) {
  const c = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrastRatio(a, b) {
  const x = relLum(a), y = relLum(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
function accentForLight(hue, chroma) {
  let lo = 0, hi = 0.6;
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    if (contrastRatio(hslToHex(hue, chroma, mid), '#ffffff') >= 4.8) lo = mid; else hi = mid;
  }
  return hslToHex(hue, chroma, lo);
}

/* Papéis do Material 3 para uma semente. dark = tema escuro. */
function buildScheme(seed, dark) {
  const [hue, s0] = hexToHsl(seed);
  const P = Math.max(s0, 0.45);   // croma das cores de destaque
  const N = 0.06;                 // croma neutra (superfícies)
  const T = (tone, chroma, h = hue) => hslToHex(h, chroma, tone / 100);
  const tert = hue + 60;          // terciária = matiz deslocado
  if (dark) return {
    primary: T(80, P), onPrimary: T(20, P * 0.6), primaryContainer: T(30, P * 0.7), onPrimaryContainer: T(90, P * 0.4),
    tertiary: T(80, P * 0.8, tert), tertiaryContainer: T(30, P * 0.6, tert),
    surface: T(6, N), surfaceContainerLow: T(10, N), surfaceContainer: T(12, N),
    surfaceContainerHigh: T(17, N), surfaceContainerHighest: T(22, N),
    onSurface: T(90, N), onSurfaceVariant: T(80, N * 1.6), outline: T(60, N * 1.6)
  };
  return {
    primary: accentForLight(hue, P), onPrimary: '#ffffff', primaryContainer: T(90, P * 0.5), onPrimaryContainer: T(10, P * 0.6),
    tertiary: accentForLight(tert, P * 0.8), tertiaryContainer: T(90, P * 0.5, tert),
    surface: T(98, N), surfaceContainerLow: T(96, N), surfaceContainer: T(94, N),
    surfaceContainerHigh: T(92, N), surfaceContainerHighest: T(90, N),
    onSurface: T(10, N), onSurfaceVariant: T(30, N * 1.6), outline: T(50, N * 1.6)
  };
}

/* Aplica o esquema na tela: CSS usa os aliases (--bg, --card, --accent...). */
function applyScheme(seed) {
  STATE.schemeSeed = seed;
  const useSeed = STATE.toggles.dynamicColor ? seed : DEFAULT_SEED;
  const sc = buildScheme(useSeed, STATE.toggles.darkTheme);
  const st = document.documentElement.style;
  st.setProperty('--bg', sc.surface);
  st.setProperty('--bg-player', sc.surfaceContainerLow);
  st.setProperty('--card', sc.surfaceContainer);
  st.setProperty('--card-hover', sc.surfaceContainerHigh);
  st.setProperty('--line', sc.outline);
  st.setProperty('--text', sc.onSurface);
  st.setProperty('--text-2', sc.onSurfaceVariant);
  st.setProperty('--text-3', sc.outline);
  st.setProperty('--accent', sc.primary);
  st.setProperty('--on-accent', sc.onPrimary);
  st.setProperty('--accent-2', sc.tertiary);
  st.setProperty('--accent-container', sc.primaryContainer);
  document.documentElement.dataset.mode = STATE.toggles.darkTheme ? 'dark' : 'light';
}
/* Aplica todas as preferências visuais de uma vez (cor, formas, movimento) */
function syncVisualToggles() {
  applyScheme(STATE.schemeSeed || current().art);
  $('app').classList.toggle('plain', !STATE.toggles.expressiveShapes);
  $('app').classList.toggle('no-motion', !STATE.toggles.animations);

const SCREENS = ['home', 'explore', 'library', 'replay', 'search', 'settings', 'settings-page', 'appearance'];

/* Abre uma tela. Empilha a atual para o botão voltar. */
function navigate(name, { push = true } = {}) {
  if (push && STATE.screen !== name) STATE.history.push(STATE.screen);
  STATE.screen = name;
  render(name);
  SCREENS.forEach(s => $('screen-' + s).classList.toggle('active', s === name));
  renderDock();
  if (name === 'replay') $('toolbar-replay').setAttribute('aria-current', 'page');
  else $('toolbar-replay').removeAttribute('aria-current');
  $('screen-' + name).scrollTop = 0;
  document.querySelectorAll('.rail-link').forEach(button => {
    if (button.dataset.screen === name) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
}
/* Volta para a tela anterior (ou Configurações se não houver histórico). */
function back() {
  const prev = STATE.history.pop() || 'home';
  navigate(prev, { push: false });
}

/* Artistas: 3 por página; a seta troca o conjunto (igual às músicas sugeridas) */
const ARTIST_PER = 3;
function allArtists() {
  const list = LIBRARY.artists.map(a => ({ title: a.title, sub: a.sub, art: a.art, glyph: a.glyph }));
  const seen = new Set(list.map(a => a.title));
  TRACKS.forEach(t => {
    if (seen.has(t.artist)) return; seen.add(t.artist);
    const n = TRACKS.filter(x => x.artist === t.artist).length;
    list.push({ title: t.artist, sub: n + (n === 1 ? ' música' : ' músicas'), cover: trackCover(t), glyph: t.artist[0].toUpperCase() });
  });
  return list;
}
function artistGridHTML(page) {
  const L = allArtists();
  return `<div class="art-grid">${Array.from({ length: ARTIST_PER }, (_, k) => {
    const a = L[(page * ARTIST_PER + k) % L.length];
    return `<div class="art-cell" onclick="comingSoon()">
        <div class="av" style="background:${a.cover || a.art}">${a.cover ? '' : a.glyph}</div>
        <div class="n">${a.title}</div><div class="c">${a.sub}</div></div>`;
  }).join('')}</div>`;
}
function artistNavHTML(n) {
  return `${n > 0 ? `<button class="back-btn" aria-label="Artistas anteriores" onclick="setArtistPage(${n - 1})">${icon('back')}</button>` : ''}
      <button class="back-btn" aria-label="Mais artistas" onclick="setArtistPage(${n + 1})">${icon('chev')}</button>`;
}
function artistsHTML() {
  const n = STATE.artistPage || 0;
  return `<div class="sug-view">${artistGridHTML(n)}</div><div class="sug-nav">${artistNavHTML(n)}</div>`;
}
function setArtistPage(n) {
  const prev = STATE.artistPage || 0, el = $('art-sec'); n = Math.max(0, n); STATE.artistPage = n;
  if (!el) return;
  const view = el.querySelector('.sug-view');
  view.innerHTML = artistGridHTML(n);
  el.querySelector('.sug-nav').innerHTML = artistNavHTML(n);
  if (!STATE.toggles.animations) return;
  view.style.setProperty('--dx', (n > prev ? 18 : -18) + 'px');
  view.classList.remove('sug-anim'); void view.offsetWidth; view.classList.add('sug-anim');
}

/* Músicas sugeridas: grade fixa de 2 colunas × 3 linhas. A seta troca o conjunto por músicas novas, sem fim
   (com poucas faixas de exemplo a ordem recomeça). A seta de voltar traz o conjunto anterior. */
const SUGGEST_ORDER = TRACKS.slice(3).concat(TRACKS.slice(0, 3)), SUGGEST_PER = 6;
function suggestGridHTML(page) {
  return `<div class="sug-grid">${Array.from({ length: SUGGEST_PER }, (_, k) => {
    const t = SUGGEST_ORDER[(page * SUGGEST_PER + k) % SUGGEST_ORDER.length];
    return `<div class="sug-cell" onclick="playTrack('${t.id}')">
        <div class="thumb" style="background:${trackCover(t)}"></div>
        <div class="txt"><div class="t">${t.title}</div><div class="s">${t.artist}</div></div>
      </div>`;
  }).join('')}</div>`;
}
function suggestNavHTML(n) {
  return `${n > 0 ? `<button class="back-btn" aria-label="Músicas anteriores" onclick="setSuggestPage(${n - 1})">${icon('back')}</button>` : ''}
      <button class="back-btn" aria-label="Novas músicas" onclick="setSuggestPage(${n + 1})">${icon('chev')}</button>`;
}
function suggestedHTML() {
  const n = STATE.suggestPage || 0;
  return `<div class="sug-view">${suggestGridHTML(n)}</div><div class="sug-nav">${suggestNavHTML(n)}</div>`;
}
function setSuggestPage(n) {
  const prev = STATE.suggestPage || 0, el = $('sug'); n = Math.max(0, n); STATE.suggestPage = n;
  if (!el) return;
  const view = el.querySelector('.sug-view');
  view.innerHTML = suggestGridHTML(n);
  el.querySelector('.sug-nav').innerHTML = suggestNavHTML(n);
  if (!STATE.toggles.animations) return;
  view.style.setProperty('--dx', (n > prev ? 18 : -18) + 'px');
  view.classList.remove('sug-anim'); void view.offsetWidth; view.classList.add('sug-anim');
}

function openSearch() {

function searchFromToolbar() {

function normalizeSearch(value) {
  return value.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
}

  $('screen-search').innerHTML = `

  updateSearchResults();
}

let recentSearchTracks = ['creep', 'about-girl'];

function updateSearchResults() {
  const query = normalizeSearch($('catalog-search').value).trim();
  const tracks = query
    ? TRACKS.filter(track => normalizeSearch([track.title, track.artist, track.album, ...track.lyrics].join(' ')).includes(query))
    : recentSearchTracks.map(trackById);
  const heading = query ? 'Resultados' : 'Pesquisas recentes';
  const empty = query ? 'Nenhuma faixa encontrada.' : 'Nenhuma pesquisa recente.';
  const clear = !query && tracks.length ? '<button class="more" onclick="clearSearchHistory()">Limpar</button>' : '';
  $('search-results').innerHTML = `
    <div class="h-section"><h2>${heading}</h2>${clear}</div>
    ${tracks.length ? tracks.map(track => `
      <button class="track-row search-result" type="button" onclick="playSearchResult('${track.id}')">
        <span class="thumb" style="background-image:${trackCover(track)}"></span>
        <span class="txt"><span class="t" style="display:block">${track.title}</span><span class="s" style="display:block">${track.artist} • ${track.album}</span></span>
        <span class="n">${fmt(track.duration)}</span>
      </button>`).join('') : `<p role="status">${empty}</p>`}
  `;
}

function playSearchResult(id) {
  recentSearchTracks = [id, ...recentSearchTracks.filter(track => track !== id)].slice(0, 6);
  playTrack(id);
}

function selectSettingsCategory(id) {

function renderSettingsResults() {
  const query = normalizeSearch($('settings-filter').value).trim();
  document.querySelectorAll('.settings-categories button').forEach(button => {
    if (!query && button.dataset.category === STATE.settingsCategory) button.setAttribute('aria-current', 'true');
    else button.removeAttribute('aria-current');
  });
  const groups = SETTINGS_GROUPS.filter(group => query || group.id === STATE.settingsCategory)
    .map(group => ({
      title: group.title,
      rows: group.rows.filter(row => !query || normalizeSearch([row.title, row.sub, group.title].join(' ')).includes(query))
    }));
  $('settings-results').innerHTML = groups.filter(group => group.rows.length).map(group => `
    <section>
      <h2>${group.title}</h2>
      <div class="group">${group.rows.map(settingsRow).join('')}</div>
    </section>
  `).join('') || '<p class="settings-empty" role="status">Nenhum ajuste encontrado.</p>';
}

function settingsRow(row) {
  const value = row.radio ? radioLabel(row.radio.group, row.radio.labels)
    : row.valueFn ? valueFns[row.valueFn]() : row.valueText || '';
  const open = row.screen ? `navigate('${row.screen}')` : `openSettingsPage('${row.page}')`;
  const rowLink = `
    <button class="settings-row-link" type="button" onclick="${open}">
      <span class="r-icon">${icon(row.icon)}</span>
      <span class="r-text"><span class="r-title">${row.title}</span>${row.sub ? `<span class="r-sub">${row.sub}</span>` : ''}</span>
      <span class="r-right">${value}<span class="r-chev">${icon('chev')}</span></span>
    </button>`;
  const toggle = row.toggle ? `
    <button type="button" role="switch" class="toggle ${STATE.toggles[row.toggle] ? 'on' : ''}" data-setting="${row.toggle}" aria-label="${row.title}" aria-checked="${STATE.toggles[row.toggle]}" onclick="toggleSetting('${row.toggle}')"></button>` : '';
  return `<div class="row">${rowLink}${toggle}</div>`;
}

const valueFns = {
  crossfadeLabel: () => ['0 s', '2 s', '4 s', '6 s', '8 s'][STATE.radio.cross]
};

function toggleSetting(key) {

  STATE.radio[group] = index;

/* Repinta a tela de ajustes atual depois de mudar um valor */
function refreshAfterSetting() {
  const focusedSetting = document.activeElement.dataset.setting;
  if (STATE.screen === 'settings-page') renderSettingsPage();
  else if (STATE.screen === 'settings') renderSettingsResults();
  else if (STATE.screen === 'appearance') renderAppearance();

/* Vidro: grava o valor e aplica nas variáveis CSS (sem repintar a tela) */
function setGlass(key, v) {
  STATE.glass[key] = Number(v);
  const el = $('gv-' + key), c = GLASS_CTRL.find(x => x.key === key);
  if (el && c) el.textContent = c.fmt(STATE.glass[key]);
  applyGlass();
}
function applyGlass() {
  const g = STATE.glass, st = document.documentElement.style;
  st.setProperty('--gl-tint', (92 - g.transparency * 0.8).toFixed(1) + '%');
  st.setProperty('--gl-blur', g.blur + 'px');
  st.setProperty('--gl-bright', (g.bright / 100).toFixed(2));
  st.setProperty('--gl-rim', (g.strength / 100).toFixed(2));
  st.setProperty('--gl-grain', (g.grain / 100 * 0.25).toFixed(3));
}
/* Computador modesto: pouco núcleo ou pouca memória */
function isLowEnd() { return (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3; }


function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =====================================================================
   10. PLAYER (reprodução, mini player, player expandido, fila)
   ===================================================================== */
let tick = null;

function playTrack(id) {
  const i = TRACKS.findIndex(t => t.id === id);
  if (i < 0) return;
  STATE.player.index = i;
  STATE.player.pos = 0;
  STATE.player.playing = true;
  renderPlayerUI();
  startTick();
}
function playRandom() {
  playTrack(TRACKS[Math.floor(Math.random() * TRACKS.length)].id);
}
function togglePlay() {
  STATE.player.playing = !STATE.player.playing;
  STATE.player.playing ? startTick() : stopTick();
  renderPlayerUI();
}
function startTick() {
  stopTick();
  tick = setInterval(() => {
    const p = STATE.player, t = current();
    if (!p.playing) return;
    p.pos += 1;
    if (p.pos >= t.duration) {
      if (p.repeat) p.pos = 0; else { next(); return; }
    }
    updateProgress();
  }, 1000);
}
function stopTick() { clearInterval(tick); tick = null; }

function next() {
  const p = STATE.player;
  if (p.shuffle) {
    let i; do { i = Math.floor(Math.random() * TRACKS.length); } while (i === p.index && TRACKS.length > 1);
    p.index = i;
  } else {
    p.index = (p.index + 1) % TRACKS.length;
  }
  p.pos = 0; p.playing = true;
  renderPlayerUI(); startTick();
}
function prev() {
  const p = STATE.player;
  if (p.pos > 4) { p.pos = 0; updateProgress(); return; }
  p.index = (p.index - 1 + TRACKS.length) % TRACKS.length;
  p.pos = 0; p.playing = true;
  renderPlayerUI(); startTick();
}

/* =====================================================================
   10b. LETRA IMERSIVA: linha ativa centralizada, linhas distantes desfocadas, sem rolagem.
   Sincronia: se a faixa tiver `times` (segundos, uma por linha) usa os tempos;
   senão distribui as linhas pela duração (aproximação até haver letras com tempo).
   ===================================================================== */
const LY = { id: null, idx: -2 };
function renderLyrics() {
  const t = current(), box = $('lyrics');
  if (!t.lyrics.length) {
    box.innerHTML = '<div class="ly-empty-wrap"><div class="ly empty">Letra não cadastrada para esta música</div></div>';
    LY.id = null; return;
  }
  if (LY.id !== t.id) {
    LY.id = t.id; LY.idx = -2;
    box.innerHTML = '<div class="ly-track" id="ly-track">' +
      t.lyrics.map((l, i) => `<div class="ly" data-i="${i}">${l}</div>`).join('') + '</div>';
    $('ly-track').addEventListener('click', e => {
      const el = e.target.closest('.ly');
      if (!el || !t.times) return;           // só pula para a linha se houver tempos
      STATE.player.pos = t.times[+el.dataset.i]; updateProgress();
    });
  }
  updateLyrics(true);
}
function updateLyrics(force) {
  const t = current(), tr = $('ly-track');
  if (!tr || !t.lyrics.length) return;
  const n = t.lyrics.length, pos = STATE.player.pos;
  let idx = 0;
  if (t.times && t.times.length === n) { for (let i = 0; i < n; i++) if (pos >= t.times[i]) idx = i; }
  else idx = Math.min(n - 1, Math.floor((pos / t.duration) * n));
  if (!force && idx === LY.idx) return;
  LY.idx = idx;
  [...tr.children].forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.classList.toggle('on', i === idx);
    el.style.setProperty('--b', d > 1 ? Math.min(d * 0.8, 3).toFixed(1) + 'px' : '0px');
  });
  const box = $('lyrics'), el = tr.children[idx];
  if (el) tr.style.transform = `translateY(${(box.clientHeight / 2 - (el.offsetTop + el.offsetHeight / 2)).toFixed(1)}px)`;
}

    const n = wave.length, gap = 3, bw = (w - gap * (n - 1)) / n, pct = STATE.player.pos / t.duration;
    for (let i = 0; i < n; i++) {
      const bh = Math.max(4, wave[i] * h), played = (i + .5) / n <= pct, bx = i * (bw + gap);
      x.globalAlpha = played ? 1 : .28; x.fillStyle = cols[played ? 0 : 1]; x.beginPath();
      if (x.roundRect) x.roundRect(bx, (h - bh) / 2, bw, bh, bw / 2); else x.rect(bx, (h - bh) / 2, bw, bh);
      x.fill();
    }
  }
  const _up = updateProgress; updateProgress = function () { _up(); drawWave(); };
  const _rp = renderPlayerUI;
  renderPlayerUI = function () {
    _rp(); const t = current(), p = STATE.player;
    glow.style.backgroundImage = trackCover(t);
    $('player').classList.toggle('is-playing', !!p.playing); ttSync();
    $('mini-art').style.boxShadow = isColor(t.art) ? `0 6px 18px color-mix(in srgb, ${t.art} 55%, transparent)` : '';
    drawWave();
  };
  const _tp = togglePlay; togglePlay = function () { _tp(); $('player').classList.toggle('is-playing', !!STATE.player.playing); };
  addEventListener('resize', () => { drawWave(); const cf = document.querySelector('.cf'); if (cf) cfUpdate(cf); });

  /* Morph mini capa ↔ capa do player (View Transitions, com fallback) */
  const _op = openPlayer, _cl = closePlayer;
  function morph(fn, toPlayer) {
    const pl = $('player'), isOpen = pl.classList.contains('open');
    if (!document.startViewTransition || reduce() || toPlayer === isOpen) { fn(); return; }
    const ma = $(desktopLayout.matches ? 'rail-art' : 'mini-art'), pc = $('p-cover'), from = toPlayer ? ma : pc, to = toPlayer ? pc : ma;
    pl.classList.add('vt'); from.style.viewTransitionName = 'kz-cover';
    const t = document.startViewTransition(() => { from.style.viewTransitionName = ''; to.style.viewTransitionName = 'kz-cover'; fn(); });
    t.finished.finally(() => { ma.style.viewTransitionName = ''; pc.style.viewTransitionName = ''; pl.classList.remove('vt'); });
  }
  openPlayer = function () { morph(_op, true); };
  closePlayer = function (afterClose) { morph(() => _cl(afterClose), false); };

  /* Especular do vidro, botões magnéticos, tilt da capa, sliders elásticos */
  let raf = 0, last = null, mg = null;
  function spec(e) {
    const g = e.target.closest && e.target.closest(GLASS); if (!g) return;
    const r = g.getBoundingClientRect(), px = (e.clientX - r.left) / r.width;
    g.style.setProperty('--mx', (px * 100).toFixed(1) + '%'); g.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    g.style.setProperty('--ang', Math.round(px * 360) + 'deg');
  }
  document.addEventListener('pointermove', e => {
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const ev = last; spec(ev);
      if (!fine || reduce()) return;
      const m = ev.target.closest && ev.target.closest(MAG);
      if (mg && mg !== m) { mg.style.translate = ''; mg = null; }
      if (m) { mg = m; const r = m.getBoundingClientRect(); m.style.translate = `${((ev.clientX - r.left - r.width / 2) * .22).toFixed(1)}px ${((ev.clientY - r.top - r.height / 2) * .22).toFixed(1)}px`; }
      if ($('player').classList.contains('open')) {
        const s = document.querySelector('.p-stage').getBoundingClientRect(), dx = (ev.clientX - s.left - s.width / 2) / s.width, dy = (ev.clientY - s.top - s.height / 2) / s.height, st = document.querySelector('.p-stage').style;
        st.setProperty('--ry', (Math.max(-1, Math.min(1, dx)) * 9).toFixed(1) + 'deg'); st.setProperty('--rx', (-Math.max(-1, Math.min(1, dy)) * 9).toFixed(1) + 'deg'); st.setProperty('--sx', (50 + dx * 60).toFixed(0) + '%');
      }
    });
  }, { passive: true });
  document.addEventListener('pointerdown', e => {
    spec(e);
    const s = e.target.closest && e.target.closest('.p-slider'); if (!s) return;
    s.classList.add('drag');
    const up = () => { s.classList.remove('drag'); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }, { passive: true });

  /* Aplica tudo no estado atual */
  applyScheme(STATE.schemeSeed || current().art);
  renderPlayerUI();
  navigate(STATE.screen || 'home', { push: false });
})();

/* Controles de janela e atalhos das referências desktop. */
function toggleDesktopRail() {
  const collapsed = $('app').classList.toggle('rail-collapsed');
  const label = collapsed ? 'Expandir menu' : 'Recolher menu';
  $('rail-toggle').setAttribute('aria-expanded', String(!collapsed));
  $('rail-toggle').setAttribute('aria-label', label);
  $('rail-toggle').title = label;
}

document.querySelectorAll('[data-icon]').forEach(slot => {
  slot.outerHTML = icon(slot.dataset.icon, slot.className);
});

function closeProfileMenu(restoreFocus = false) {
  $('profile-menu').hidden = true;
  $('profile-toggle').setAttribute('aria-expanded', 'false');
  if (restoreFocus) $('profile-toggle').focus();
}

function toggleProfileMenu() {
  if (!$('profile-menu').hidden) {
    closeProfileMenu(true);
    return;
  }
  $('profile-menu').hidden = false;
  $('profile-toggle').setAttribute('aria-expanded', 'true');
  $('profile-menu').querySelector('button').focus();
}

function navigateFromToolbar(screen, page) {
  closeProfileMenu();
  if ($('queue').classList.contains('open')) closeQueue();
  const focusDestination = () => {
    if (screen === 'search') return;
    const heading = $('screen-' + screen).querySelector('h1');
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
  };
  if (page) openSettingsPage(page);
  else navigate(screen);
  if ($('player').classList.contains('open')) closePlayer(focusDestination);
  else focusDestination();
}

$('catalog-search-form').addEventListener('submit', event => {
  event.preventDefault();
  searchFromToolbar();
});
$('catalog-search').addEventListener('input', searchFromToolbar);
document.addEventListener('pointerdown', event => {
  if (!$('profile-control').contains(event.target)) closeProfileMenu();
});
$('profile-control').addEventListener('focusout', event => {
  if (!$('profile-control').contains(event.relatedTarget)) closeProfileMenu();
});

document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.isComposing) return;
  const player = $('player'), queue = $('queue'), more = $('more');
  if (event.key === 'Escape') {
    if (!$('profile-menu').hidden) closeProfileMenu(true);
    else if (more.classList.contains('open')) closeMore();
    else if (queue.classList.contains('open')) closeQueue();
    else if (player.classList.contains('open')) closePlayer();
    else return;
    event.preventDefault();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && !event.altKey && event.key.toLowerCase() === 'k') {
    if (more.classList.contains('open')) closeMore();
    if (queue.classList.contains('open')) closeQueue();
    openSearch();
    event.preventDefault();
    return;
  }
  if (event.code === 'Space' && !event.repeat && !event.ctrlKey && !event.metaKey &&
      !event.altKey && !event.target.closest('input, textarea, select, button, a, [contenteditable]')) {
    event.preventDefault();
    togglePlay();
  }
});
</script>
