# Build remoto do Kazzu (somente Android e iPhone, sem releases oficiais).
#
# Execução manual:
#   gh workflow run build.yml --ref feat/cuscusdc -f platform=android
#   gh workflow run build.yml --ref feat/cuscusdc -f platform=ios
#   gh workflow run build.yml --ref feat/cuscusdc -f platform=both

name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plataforma"
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUSTFLAGS: "-C debuginfo=0"
  NDK_VERSION: "30.0.16248370"
  BUILD_TOOLS: "35.0.1"
  CI: "true"

jobs:
  meta:
    name: Versão
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Calcular versão
        id: v
        shell: bash
        run: |
          v="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)-ci.${GITHUB_RUN_NUMBER}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  android:
    name: Android ARM64 (APK)
    if: inputs.platform == 'android' || inputs.platform == 'both'
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Conferir compilador da ponte Android
        shell: bash
        run: javac -version

      - name: Rust + alvo Android
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: SDK/NDK/cmake exatos
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" "cmake;3.31.6" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/3.31.6
          key: android-sdk-${{ runner.os }}-${{ env.NDK_VERSION }}
          restore-keys: android-sdk-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
          cache-on-failure: true

      - name: Chave de assinatura
        id: sign
        shell: bash
        env:
          KS_B64: ${{ secrets.KAZZU_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KAZZU_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KS_B64" && -n "$KS_PASS" ]]; then
            umask 077
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kazzu-release.jks"
            printf '%s\n' "$KS_PASS" > "$RUNNER_TEMP/kazzu-release.pass"
            echo "KAZZU_KEYSTORE=$RUNNER_TEMP/kazzu-release.jks" >> "$GITHUB_ENV"
            echo "KAZZU_KEYSTORE_PASS_FILE=$RUNNER_TEMP/kazzu-release.pass" >> "$GITHUB_ENV"
            echo "release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segredos de assinatura ausentes: APK com chave descartável (--debug-sign)."
          fi

      - name: Compilar e assinar o APK
        shell: bash
        env:
          KAZZU_SIGNER_SHA256: ${{ vars.KAZZU_SIGNER_SHA256 }}
        run: |
          flag=""
          [[ "${{ steps.sign.outputs.release_key }}" == "true" ]] || flag="--debug-sign"
          scripts/build-apk.sh --abi arm64-v8a --version "${{ needs.meta.outputs.version }}" $flag

      - uses: actions/upload-artifact@v4
        with:
          name: kazzu-android-arm64-${{ needs.meta.outputs.version }}
          path: |
            target/android/apk/*.apk
            target/android/apk/*.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (device + simulador)
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    needs: meta
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust + alvos Apple
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim --target x86_64-apple-ios
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-arm64
          cache-on-failure: true

      - name: Verificar Xcode
        shell: bash
        run: xcodebuild -version

      - name: Xcodegen
        shell: bash
        run: brew install xcodegen

      - name: Preparar projeto iOS
        shell: bash
        run: scripts/build-ios.sh --prepare

      - name: Compilar para iPhone (device)
        shell: bash
        run: scripts/build-ios.sh --target device --version "${{ needs.meta.outputs.version }}"

      - name: Compilar para simulador
        shell: bash
        run: scripts/build-ios.sh --target simulator --version "${{ needs.meta.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: kazzu-ios-${{ needs.meta.outputs.version }}
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
